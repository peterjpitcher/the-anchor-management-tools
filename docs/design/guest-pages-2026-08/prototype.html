ervices<\u002Fli>\n                  <li><span style=\"font-weight:700\">Legitimate Interests:<\u002Fspan> For customer service, security, and business improvement<\u002Fli>\n                <\u002Ful>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:13px;font-style:italic;color:var(--text-muted);padding-top:6px;border-top:1px solid var(--border)\">Sections 4 to 15 continue in the same rhythm: DM Serif Display numbered headings at 21px, Outfit body at 15px/1.7, sand-tinted boxes for contact blocks.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background:var(--anchor-green-deep);color:var(--anchor-cream-text);padding:22px 20px;display:flex;flex-direction:column;gap:11px\">\n              <div style=\"font-size:12px;line-height:1.6;color:rgba(240,230,198,0.7)\">The Anchor, Horton Road, Stanwell Moor Village, Surrey TW19 6AQ<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px;font-size:13px\">\n                <a href=\"tel:01753682707\" style=\"color:var(--anchor-gold-bright);font-weight:500\">01753 682 707<\u002Fa>\n                <a href=\"mailto:manager@the-anchor.pub\" style=\"color:var(--anchor-gold-bright);font-weight:500\">manager@the-anchor.pub<\u002Fa>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:16px;padding-top:11px;border-top:1px solid rgba(201,160,32,0.25);font-size:12px\">\n                <a href=\"https://www.the-anchor.pub\" style=\"color:rgba(240,230,198,0.82)\">The Anchor website<\u002Fa>\n                <a href=\"/privacy\" style=\"color:rgba(240,230,198,0.82)\">Privacy<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:10px;width:390px\">\n          <div style=\"display:flex;flex-direction:column;gap:2px\">\n            <div style=\"font-family:var(--font-mono);font-size:12px;color:var(--text-strong);font-weight:600\">/error<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--text-muted)\">Friendly error page for broken links<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:390px;background:var(--bg);border:1px solid var(--border-strong);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lg)\">\n            <div style=\"background:var(--anchor-green);padding:15px 20px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--anchor-gold)\">\n              <img src=\"7571860f-0f23-42fe-bccd-4987592eba8c\" alt=\"The Anchor\" style=\"width:116px;height:auto;display:block\">\n            <\u002Fdiv>\n            <div style=\"padding:44px 18px 48px;display:flex;flex-direction:column;gap:22px\">\n              <div style=\"display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center\">\n                <span style=\"width:56px;height:56px;border-radius:50%;background:rgba(177,55,47,0.1);color:var(--anchor-danger);display:inline-flex;align-items:center;justify-content:center;flex:none\"><i data-lucide=\"alert-circle\" style=\"width:28px;height:28px\"><\u002Fi><\u002Fspan>\n                <h1 style=\"font-size:30px;margin:0\">Link already used or expired<\u002Fh1>\n                <p style=\"margin:0;font-size:15px;line-height:1.7;color:var(--text-muted)\">This link was already used or has expired. You can request another password reset from the login page.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"background:var(--surface-sunk);border:1px solid var(--border);border-radius:var(--radius-md);padding:13px;font-family:var(--font-mono);font-size:14px;color:var(--text-muted);text-align:center\">REF-otp_expired<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <button type=\"button\" class=\"anchor-btn anchor-btn--primary anchor-btn--lg anchor-btn--block\">Try again<\u002Fbutton>\n                <button type=\"button\" class=\"anchor-btn anchor-btn--outline anchor-btn--lg anchor-btn--block\">Back to Dashboard<\u002Fbutton>\n              <\u002Fdiv>\n              <a href=\"mailto:support@orangejelly.co.uk\" style=\"font-size:12px;text-align:center;color:var(--text-muted);text-decoration:underline;text-underline-offset:3px\">Contact support<\u002Fa>\n            <\u002Fdiv>\n            <div style=\"background:var(--anchor-green-deep);color:var(--anchor-cream-text);padding:22px 20px;display:flex;flex-direction:column;gap:11px\">\n              <div style=\"font-size:12px;line-height:1.6;color:rgba(240,230,198,0.7)\">The Anchor, Horton Road, Stanwell Moor Village, Surrey TW19 6AQ<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px;font-size:13px\">\n                <a href=\"tel:01753682707\" style=\"color:var(--anchor-gold-bright);font-weight:500\">01753 682 707<\u002Fa>\n                <a href=\"mailto:manager@the-anchor.pub\" style=\"color:var(--anchor-gold-bright);font-weight:500\">manager@the-anchor.pub<\u002Fa>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:16px;padding-top:11px;border-top:1px solid rgba(201,160,32,0.25);font-size:12px\">\n                <a href=\"https://www.the-anchor.pub\" style=\"color:rgba(240,230,198,0.82)\">The Anchor website<\u002Fa>\n                <a href=\"/privacy\" style=\"color:rgba(240,230,198,0.82)\">Privacy<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:20px;padding-top:24px;border-top:1px solid var(--border-strong)\">\n      <h2 style=\"font-size:26px;margin:0\">Desktop behaviour<\u002Fh2>\n      <div style=\"display:flex;flex-wrap:wrap;gap:24px\">\n        <div class=\"anchor-card\" style=\"width:320px\">\n          <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px\">\n            <div class=\"anchor-kicker\">Layout<\u002Fdiv>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:var(--text)\">The content column caps at 560px and centres. The green brand bar and green footer go full width, so the page still reads as The Anchor on a laptop.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"anchor-card\" style=\"width:320px\">\n          <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px\">\n            <div class=\"anchor-kicker\">Type<\u002Fdiv>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:var(--text)\">Page h1 steps from 29px to 40px, the money figure from 48px to 60px. Body stays 15/16px. Nothing else changes.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"anchor-card\" style=\"width:320px\">\n          <div style=\"padding:20px;display:flex;flex-direction:column;gap:8px\">\n            <div class=\"anchor-kicker\">Controls<\u002Fdiv>\n            <p style=\"margin:0;font-size:14px;line-height:1.65;color:var(--text)\">Full-width buttons become auto-width and left-aligned above 640px, matching the existing <span style=\"font-family:var(--font-mono);font-size:13px\">sm:w-auto<\u002Fspan> behaviour. Pre-order seat fields go two-up.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;,&quot;section&quot;:&quot;Surface&quot;},&quot;cardPadding&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:20,&quot;min&quot;:14,&quot;max&quot;:32,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Density&quot;},&quot;showTrustLine&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Payment pages&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() { this.icons(); }\n  componentDidUpdate() { this.icons(); }\n  icons() {\n    if (window.lucide) { window.lucide.createIcons(); return; }\n    if (!document.getElementById('lucide-cdn')) {\n      const s = document.createElement('script');\n      s.id = 'lucide-cdn';\n      s.src = 'https://unpkg.com/lucide@latest/dist/umd/lucide.min.js';\n      s.onload = () => window.lucide && window.lucide.createIcons();\n      document.head.appendChild(s);\n    }\n  }\n  renderVals() {\n    const pad = this.props.cardPadding ?? 20;\n    return {\n      themeClass: this.props.theme === 'dark' ? 'theme-dark' : '',\n      cardPad: pad + 'px',\n      showTrustLine: this.props.showTrustLine ?? true\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
