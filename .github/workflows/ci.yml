name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit
        env:
          # tsc on this codebase peaks a little over 4 GB, which is right on the
          # runner's default heap limit, so it aborted with exit 134 rather than
          # reporting type errors. Give it headroom. The Build step below already
          # does the same thing for the same reason.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.example.com
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          CRON_SECRET: placeholder-cron-secret

  database-contract:
    # Rules that only a real Postgres can prove. The application level tests stand in for the
    # database, so they cannot demonstrate what an index actually does. A duplicate preferred
    # name reached a new starter's final screen in production because the uniqueness index is
    # partial and stays silent until a row's status changes, which no mock would have caught.
    #
    # The schema fixture is deliberately minimal and the definitions under test are applied from
    # the REAL migration files, so this cannot drift from what ships.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGURL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Create the minimal schema the migrations attach to
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f tests/db/fixture.sql

      - name: Apply the real migrations under test
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260809120000_employee_preferred_name.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260819030000_leave_types.sql

      - name: Assert the database contract
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f tests/db/schema-contract.sql

  supabase-dry-run:
    runs-on: ubuntu-latest
    if: ${{ (vars.RUN_SUPABASE_DRY_RUN == 'true') }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project (if token and project set)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Dry-run push migrations (optional)
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        run: |
          supabase db push --dry-run
